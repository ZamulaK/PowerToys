name: Build full installer (manual)

# Builds the complete PowerToys solution and produces the installer, mirroring
# tools\build\build-installer.ps1, on a hosted Windows runner. This is a long
# job (roughly an hour on a hosted runner) so it only runs when started by hand.
#
# Notes:
# - MSIX packages (CmdPal, context-menu sparse packages) are signed with a
#   self-signed certificate created on the runner. The .cer is uploaded next
#   to the installer; import it into "Trusted Root Certification Authorities"
#   and "Trusted People" on the target machine before installing.
# - The Microsoft.Windows.Terminal.Versioning package used to stamp the CmdPal
#   MSIX lives on a private feed, so CmdPal keeps its default 0.0.1.0 package
#   version. Everything else is stamped with the requested version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to stamp on the build (w.x.y). Use a version higher than the installed
          one so the installer performs an upgrade; the runner also requires the Settings
          app version to match its own, which a single build guarantees.
        required: true
        default: '0.101.2600'
      per_user:
        description: Build the per-user installer instead of the machine-wide one.
        type: boolean
        required: false
        default: false
      enable_cmdpal_aot:
        description: Enable AOT compilation for CmdPal (much slower build).
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  NUGET_PACKAGES: D:\NuGetPackages
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  BuildPlatform: x64
  BuildConfiguration: Release

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.303

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Install NuGet
        uses: nuget/setup-nuget@v2

      - name: Locate vcpkg
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -requires Microsoft.VisualStudio.Component.Vcpkg -property installationPath
          if ([string]::IsNullOrEmpty($vsRoot)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg deps/vcpkg
            if ($LASTEXITCODE -ne 0) { throw "git clone vcpkg failed" }
            & deps/vcpkg/bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg failed" }
            $vcpkgRoot = Resolve-Path deps/vcpkg
            Write-Host "Using vcpkg from local clone ($vcpkgRoot)"
          } else {
            $vcpkgRoot = Join-Path $vsRoot 'VC\vcpkg'
            Write-Host "Using vcpkg from Visual Studio ($vcpkgRoot)"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            D:\NuGetPackages
            packages
          key: nuget-installer-${{ runner.os }}-${{ hashFiles('**/packages.config', 'Directory.Packages.props', '**/*.csproj', '**/*.vcxproj', '**/*.wixproj') }}
          restore-keys: |
            nuget-installer-${{ runner.os }}-
            nuget-${{ runner.os }}-

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Stamp build version
        shell: pwsh
        env:
          STAMP_VERSION: ${{ inputs.version }}
        run: |
          .\tools\build\versionSetting.ps1 -versionNumber $env:STAMP_VERSION -DevEnvironment 'Local' -Channel private -SourceCommit $env:GITHUB_SHA
          Get-Content src\Version.props

      - name: Report free disk space before build
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} | Format-Table -AutoSize

      - name: Use the v143 toolset for projects that hard-code v145
        shell: pwsh
        run: |
          # The hosted runner has Visual Studio 2022 (MSVC 14.4x). Two projects pin the
          # VS 2026 toolset explicitly instead of inheriting Cpp.Build.props, which already
          # selects v143 on VS 2022. Rewrite them for this build only.
          $pinned = @(
            'src\modules\ZoomIt\ZoomItBreak\ZoomItBreak.vcxproj',
            'src\modules\MouseUtils\CursorWrap\CursorWrapTests\CursorLog\CursorLog\CursorLog.vcxproj'
          )
          foreach ($file in $pinned) {
            if (Test-Path $file) {
              (Get-Content $file -Raw) -replace '<PlatformToolset>v145</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' | Set-Content $file -NoNewline
              Write-Host "Patched $file"
            }
          }

      - name: Skip the CurrentUser\Root certificate import (hangs on a hosted runner)
        shell: pwsh
        run: |
          # cert-management.ps1 imports the self-signed MSIX certificate into CurrentUser\Root.
          # Windows guards that store with a confirmation dialog, which nobody can click on a
          # hosted runner, so the previous run sat there until the six-hour timeout.
          # LocalMachine\Root (imported without a prompt) is enough for the signature chain.
          $certScript = 'tools\build\cert-management.ps1'
          $pattern = 'if \(-not \(ImportAndVerifyCertificate -cerPath \$cerPath -storePath "Cert:\\CurrentUser\\Root"\)\) \{ return \$null \}'
          $content = Get-Content $certScript -Raw
          if ($content -notmatch $pattern) { throw "Expected CurrentUser\Root import line not found in $certScript; script changed upstream." }
          $content -replace $pattern, '# CI: CurrentUser\Root import skipped; it opens a confirmation dialog that never returns on a hosted runner.' | Set-Content $certScript -NoNewline
          Write-Host "Patched $certScript"

      - name: Import the persistent signing certificate (optional)
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          # cert-management.ps1 reuses any certificate with the expected subject that already
          # sits in CurrentUser\My. Importing a fixed certificate from repository secrets here
          # means every installer is signed by the same certificate, so the target machine only
          # has to trust it once. Without the secrets a throwaway certificate is created as before.
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Host 'SIGNING_PFX_BASE64 secret not set; a throwaway certificate will be created for this build.'
            return
          }
          $subject = 'CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
          if ($cert.Subject -ne $subject) { throw "Signing certificate subject is '$($cert.Subject)'; expected '$subject'." }
          if (-not $cert.HasPrivateKey) { throw 'Signing certificate was imported without its private key.' }
          if ($cert.NotAfter -lt (Get-Date).AddDays(1)) { throw "Signing certificate expired on $($cert.NotAfter)." }
          Write-Host "Using persistent signing certificate $($cert.Thumbprint) (valid until $($cert.NotAfter.ToString('yyyy-MM-dd')))"
          "PERSISTENT_SIGNING_CERT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build solution and tools (first pass)
        shell: pwsh
        env:
          PER_USER: ${{ inputs.per_user && 'true' || 'false' }}
          CMDPAL_AOT: ${{ inputs.enable_cmdpal_aot && 'true' || 'false' }}
        run: |
          # The repo script uses Write-Error for a non-fatal step (the private
          # Terminal.Versioning feed is unreachable from here) and exits explicitly
          # on real MSBuild failures, so run it with a non-terminating preference
          # and verify the output afterwards.
          $ErrorActionPreference = 'Continue'
          $params = @{
            Platform      = $env:BuildPlatform
            Configuration = $env:BuildConfiguration
            PerUser       = $env:PER_USER
            Force         = $true
          }
          if ($env:CMDPAL_AOT -eq 'true') { $params.EnableCmdPalAOT = $true }
          & .\tools\build\build-installer.ps1 @params
          $scriptExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($scriptExit -ne 0) {
            throw "Solution/installer build failed (script exit $scriptExit)"
          }

      - name: Sign the Settings and Quick Access executables
        shell: pwsh
        run: |
          # In Release builds the runner only talks to a PowerToys.Settings.exe (and
          # PowerToys.QuickAccess.exe) whose Authenticode signer is named "Microsoft
          # Corporation" and chains to a certificate in the machine root store
          # (src/common/interop/pipe_caller_auth.cpp). The installer script already
          # created such a self-signed certificate for the MSIX packages; reuse it so the
          # shipped Settings app is accepted once the .cer is trusted on the target machine.
          $subject = 'CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US'
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -eq $subject } | Sort-Object NotAfter -Descending | Select-Object -First 1
          if (-not $cert) { throw 'Self-signed certificate from the MSIX signing step was not found.' }
          $targets = @(
            "$env:BuildPlatform\$env:BuildConfiguration\WinUI3Apps\PowerToys.Settings.exe",
            "$env:BuildPlatform\$env:BuildConfiguration\WinUI3Apps\PowerToys.QuickAccess.exe"
          ) | Where-Object { Test-Path $_ }
          foreach ($target in $targets) {
            $result = Set-AuthenticodeSignature -FilePath $target -Certificate $cert -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
            Write-Host "$target : $($result.Status) $($result.StatusMessage)"
            if ($result.Status -ne 'Valid') { throw "Signing $target failed: $($result.StatusMessage)" }
          }

      - name: Package the installer (second pass with signed executables)
        shell: pwsh
        env:
          PER_USER: ${{ inputs.per_user && 'true' || 'false' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $params = @{
            Platform      = $env:BuildPlatform
            Configuration = $env:BuildConfiguration
            PerUser       = $env:PER_USER
            Force         = $true
            SkipBuild     = $true
          }
          & .\tools\build\build-installer.ps1 @params
          $scriptExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'

          $setupType = if ($env:PER_USER -eq 'true') { 'UserSetup' } else { 'MachineSetup' }
          $outDir = "installer\PowerToysSetupVNext\$env:BuildPlatform\$env:BuildConfiguration\$setupType"
          $installers = @(Get-ChildItem -Path $outDir -Filter 'PowerToys*Setup*.exe' -ErrorAction SilentlyContinue)
          if ($scriptExit -ne 0 -or $installers.Count -eq 0) {
            throw "Installer packaging failed (script exit $scriptExit); no installer found under $outDir"
          }
          $installers | ForEach-Object { Write-Host "Built installer: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)" }
          "INSTALLER_DIR=$outDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Collect installer and signing certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\installer | Out-Null
          Get-ChildItem -Path $env:INSTALLER_DIR -Filter 'PowerToys*Setup*.exe' | Copy-Item -Destination artifacts\installer
          $subject = 'CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US'
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -eq $subject } | Sort-Object NotAfter -Descending | Select-Object -First 1
          if ($cert) {
            Export-Certificate -Cert $cert -FilePath artifacts\installer\PowerToys-SelfSigned-MSIX.cer | Out-Null
            Write-Host "Exported signing certificate $($cert.Thumbprint)"
          } else {
            Write-Warning 'Self-signed MSIX certificate not found; MSIX packages may be unsigned.'
          }
          $certNote = if ($env:PERSISTENT_SIGNING_CERT) {
            "Signed with the persistent certificate $($env:PERSISTENT_SIGNING_CERT) from the repository secrets. If this machine already trusts that certificate, skip the import below."
          } else {
            "Signed with a throwaway certificate ($($cert.Thumbprint)) created for this build only, so the import below is required for this build."
          }
          @"
          PowerToys private build ${{ inputs.version }} from commit ${{ github.sha }}.
          $certNote

          Before running the installer, import PowerToys-SelfSigned-MSIX.cer into both
          "Trusted Root Certification Authorities" and "Trusted People" of the Local Computer
          store (elevated PowerShell):

            Import-Certificate -FilePath .\PowerToys-SelfSigned-MSIX.cer -CertStoreLocation Cert:\LocalMachine\Root
            Import-Certificate -FilePath .\PowerToys-SelfSigned-MSIX.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople

          The runner refuses to talk to a Settings app that is not signed by a "Microsoft
          Corporation" certificate chained to the machine root store, so without this import the
          Settings app will open but none of its changes will be saved. The same certificate signs
          the MSIX-based pieces (Command Palette, Explorer context menus).

          Security note: while this certificate is trusted, anything signed with its private key
          is accepted as "Microsoft Corporation" on this machine. A throwaway certificate's key only
          ever existed on the GitHub-hosted runner and was discarded with it; the persistent
          certificate's key lives in the repository's encrypted secrets and on the PC that created it.
          "@ | Out-File -FilePath artifacts\installer\README.txt -Encoding utf8
          Get-ChildItem artifacts\installer | Format-Table Name, Length -AutoSize

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: powertoys-installer-${{ inputs.version }}-x64
          path: artifacts/installer/**
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-build-logs
          path: |
            build.*.errors.log
            build.*.warnings.log
            installer/build.*.errors.log
            installer/build.*.warnings.log
            tools/**/build.*.errors.log
          if-no-files-found: ignore

      - name: Upload binary logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-build-binlogs
          path: |
            build.*.trace.binlog
            installer/build.*.trace.binlog
          if-no-files-found: ignore
